<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1290" width="760" height="1290" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa0ac"/></marker>
    <marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a640"/></marker>
    <marker id="aF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa8e0"/></marker>
  </defs>
  <style>
    .t{fill:#eceef2;font-size:15px;font-weight:bold}
    .s{fill:#b8bcc6;font-size:12px}
    .m{fill:#8fd18f;font-size:12px;font-weight:bold}
    .h{fill:#eceef2;font-size:20px;font-weight:bold}
    .lbl{font-size:13px;font-weight:bold}
  </style>
  <rect width="760" height="1290" fill="#14161c"/>
  <text x="380" y="32" text-anchor="middle" class="h">Part III · The Jigger's Holds</text>
  <text x="380" y="52" text-anchor="middle" class="m">green = the battlemap (maps/&lt;name&gt;.webp) · "no map" = theatre of mind</text>

  <rect x="200" y="66" width="360" height="62" rx="8" fill="#232733" stroke="#9aa0ac"/>
  <text x="380" y="90" text-anchor="middle" class="t">0 · The Fall</text>
  <text x="380" y="110" text-anchor="middle" class="s">Grab the heart, get off the Unspent · <tspan class="m">no map</tspan></text>
  <line x1="380" y1="128" x2="380" y2="154" stroke="#9aa0ac" stroke-width="2" marker-end="url(#a)"/>

  <rect x="200" y="156" width="360" height="62" rx="8" fill="#232733" stroke="#9aa0ac"/>
  <text x="380" y="180" text-anchor="middle" class="t">1 · Kesti's Briefing</text>
  <text x="380" y="200" text-anchor="middle" class="s">Sink clock starts · Old Hobb offers to guide · <tspan class="m">no map</tspan></text>
  <line x1="380" y1="218" x2="380" y2="244" stroke="#9aa0ac" stroke-width="2" marker-end="url(#a)"/>

  <polygon points="380,246 540,294 380,342 220,294" fill="#2b2f3d" stroke="#9aa0ac"/>
  <text x="380" y="290" text-anchor="middle" class="t">2 · The Underside</text>
  <text x="380" y="308" text-anchor="middle" class="s">Which way up?</text>
  <path d="M220,294 L190,294 L190,380" fill="none" stroke="#e0a640" stroke-width="2.5" marker-end="url(#aS)"/>
  <text x="62" y="284" class="lbl" fill="#e0a640">INSIDE · the reading</text>
  <path d="M540,294 L570,294 L570,380" fill="none" stroke="#5aa8e0" stroke-width="2.5" marker-end="url(#aF)"/>
  <text x="548" y="284" class="lbl" fill="#5aa8e0">OUTSIDE · open air</text>

  <!-- INSIDE -->
  <rect x="40" y="382" width="300" height="74" rx="8" fill="#2e2618" stroke="#e0a640"/>
  <text x="190" y="406" text-anchor="middle" class="t">A1 · The Tended Holds</text>
  <text x="190" y="426" text-anchor="middle" class="s">Exploration · Hobb's rite reveals WAKE</text>
  <text x="190" y="446" text-anchor="middle" class="m">no map</text>
  <line x1="190" y1="456" x2="190" y2="482" stroke="#e0a640" stroke-width="2.5" marker-end="url(#aS)"/>

  <rect x="40" y="484" width="300" height="62" rx="8" fill="#2e2618" stroke="#e0a640"/>
  <text x="190" y="508" text-anchor="middle" class="t">A2 · The Root-choked Hull</text>
  <text x="190" y="528" text-anchor="middle" class="s">Hazard · <tspan class="m">root-choked-hull</tspan></text>
  <line x1="190" y1="546" x2="190" y2="572" stroke="#e0a640" stroke-width="2.5" marker-end="url(#aS)"/>

  <rect x="40" y="574" width="300" height="94" rx="8" fill="#2e2618" stroke="#e0a640"/>
  <text x="190" y="598" text-anchor="middle" class="t">A3 + A4 · Wardens and Gallery</text>
  <text x="190" y="618" text-anchor="middle" class="s">The wardens in the halls (fight, moderate),</text>
  <text x="190" y="636" text-anchor="middle" class="s">the gallery puzzle in the vault (+1 stage)</text>
  <text x="190" y="656" text-anchor="middle" class="m">wardens-corridors · THE INSIDE FIGHT</text>
  <line x1="190" y1="668" x2="190" y2="770" stroke="#e0a640" stroke-width="2.5" marker-end="url(#aS)"/>
  <text x="200" y="726" class="s" fill="#e0a640">lower-right stairs</text>

  <!-- OUTSIDE -->
  <polygon points="570,382 720,438 570,494 420,438" fill="#18273a" stroke="#5aa8e0"/>
  <text x="570" y="428" text-anchor="middle" class="t">B1 · The Gate</text>
  <text x="570" y="446" text-anchor="middle" class="s">spot the shaft mouth,</text>
  <text x="570" y="462" text-anchor="middle" class="s">cross open air · <tspan class="m">no map</tspan></text>
  <path d="M420,438 L360,438 L360,410 L342,410" fill="none" stroke="#5aa8e0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aF)"/>
  <text x="352" y="400" class="s" fill="#5aa8e0">fail: +1 stage,</text>
  <text x="352" y="470" class="s" fill="#5aa8e0">go inside</text>
  <line x1="570" y1="494" x2="570" y2="520" stroke="#5aa8e0" stroke-width="2.5" marker-end="url(#aF)"/>

  <rect x="420" y="522" width="300" height="74" rx="8" fill="#18273a" stroke="#5aa8e0"/>
  <text x="570" y="546" text-anchor="middle" class="t">B2 · The Hanging Fleet</text>
  <text x="570" y="566" text-anchor="middle" class="s">Skill challenge · help a crew hold: −1 stage</text>
  <text x="570" y="586" text-anchor="middle" class="m">no map</text>
  <line x1="570" y1="596" x2="570" y2="622" stroke="#5aa8e0" stroke-width="2.5" marker-end="url(#aF)"/>

  <rect x="420" y="624" width="300" height="74" rx="8" fill="#18273a" stroke="#5aa8e0"/>
  <text x="570" y="648" text-anchor="middle" class="t">B3 · Wardens on the Root-beard</text>
  <text x="570" y="668" text-anchor="middle" class="s">Fight, moderate · open air, no flying</text>
  <text x="570" y="688" text-anchor="middle" class="m">root-beard · THE OUTSIDE FIGHT</text>
  <line x1="570" y1="698" x2="570" y2="770" stroke="#5aa8e0" stroke-width="2.5" marker-end="url(#aF)"/>
  <text x="580" y="740" class="s" fill="#5aa8e0">shaft climb (narrated)</text>
  <text x="580" y="756" class="s" fill="#5aa8e0">→ bottom stairs</text>

  <!-- gear chamber -->
  <rect x="100" y="772" width="560" height="96" rx="10" fill="#2b2f3d" stroke="#eceef2" stroke-width="2"/>
  <text x="380" y="796" text-anchor="middle" class="t">A5 / B4 · The Gear Chamber (both routes)</text>
  <text x="380" y="816" text-anchor="middle" class="s">Hazard room: the pull, three clockworks, the strike cycle + wild strike, the governor</text>
  <text x="380" y="834" text-anchor="middle" class="s">Inside enters at the lower-right stairs (short); outside at the bottom stairs (the whole room)</text>
  <text x="380" y="856" text-anchor="middle" class="m">lift-shaft</text>
  <line x1="380" y1="868" x2="380" y2="894" stroke="#9aa0ac" stroke-width="2" marker-end="url(#a)"/>

  <!-- boss -->
  <rect x="100" y="896" width="560" height="180" rx="10" fill="#2b2f3d" stroke="#eceef2" stroke-width="2"/>
  <text x="380" y="920" text-anchor="middle" class="t">5 · The Engine Heart · boss</text>
  <text x="380" y="940" text-anchor="middle" class="s">Warden (severe) + the engine as a complex hazard; spawns from the gangways</text>
  <text x="380" y="958" text-anchor="middle" class="s">Goal: the carrier at the socket completes 4 seating steps in order</text>
  <text x="380" y="980" text-anchor="middle" class="s">CRADLE (Athletics) · TURN (Crafting/Arcana)</text>
  <text x="380" y="996" text-anchor="middle" class="s">WAKE (Occultism/Religion/Performance) · BIND (Thievery/Crafting)</text>
  <text x="380" y="1014" text-anchor="middle" class="s">Each 2 actions + check · unknown step: Recall Knowledge first and a harder DC</text>
  <text x="250" y="1036" text-anchor="middle" class="s" fill="#e0a640">Inside: all 4 known</text>
  <text x="510" y="1036" text-anchor="middle" class="s" fill="#5aa8e0">Outside: only CRADLE known</text>
  <text x="380" y="1060" text-anchor="middle" class="m">engine-heart</text>
  <line x1="380" y1="1076" x2="380" y2="1100" stroke="#9aa0ac" stroke-width="2" marker-end="url(#a)"/>

  <rect x="200" y="1102" width="360" height="52" rx="8" fill="#1d2b22" stroke="#6fc28a"/>
  <text x="380" y="1124" text-anchor="middle" class="t">6 · The Rise</text>
  <text x="380" y="1142" text-anchor="middle" class="s">The Jigger lifts and warms · cloud-water rains</text>

  <text x="40" y="1186" class="t">The Sink Clock (8 stages)</text>
  <text x="40" y="1206" class="s">+1 per 10-minute activity, per crit fail, for the gallery · −1 at B2, via Kesti's lines, or by dumping weight</text>
  <text x="40" y="1226" class="s">1 airship tears free · 2 gardens slide · 3 the Main lurches · 4 the dead Lord's spire falls · 5 debris on the top decks</text>
  <text x="40" y="1246" class="s">6 settles on the stack · 7 the stack buckles (6–7 grim but fixable) · 8 engine stops, lower city lost</text>
  <text x="40" y="1272" class="s">Inside spends time to make the boss easier; outside saves time and lives and makes the boss harder.</text>
</svg>
