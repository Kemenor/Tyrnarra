<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Tyrnarra favicon</title>
  <desc id="desc">Three celestial bodies rising from the luminous Cloud Sea, encircled by thirteen small stars.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="32" x2="448" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101C3A"/>
      <stop offset="0.52" stop-color="#13132D"/>
      <stop offset="1" stop-color="#070A16"/>
    </linearGradient>
    <radialGradient id="sun" cx="38%" cy="32%" r="64%">
      <stop offset="0" stop-color="#FFF5B7"/>
      <stop offset="0.55" stop-color="#F4C65F"/>
      <stop offset="1" stop-color="#B86A2B"/>
    </radialGradient>
    <radialGradient id="moonA" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#F5F0FF"/>
      <stop offset="0.68" stop-color="#9F90D7"/>
      <stop offset="1" stop-color="#55508A"/>
    </radialGradient>
    <radialGradient id="moonB" cx="32%" cy="28%" r="75%">
      <stop offset="0" stop-color="#F0FFFF"/>
      <stop offset="0.62" stop-color="#9CC9D6"/>
      <stop offset="1" stop-color="#4D7389"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="286" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset="0.46" stop-color="#DCE7EF"/>
      <stop offset="1" stop-color="#AFC1D2"/>
    </linearGradient>
    <linearGradient id="cloudShadow" x1="60" y1="318" x2="452" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B6C6D5" stop-opacity="0.16"/>
      <stop offset="0.52" stop-color="#7488A5" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#39465F" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- distant astral arc -->
    <path d="M77 297C111 137 208 77 256 77C304 77 401 137 435 297" fill="none" stroke="#EBC86F" stroke-width="9" stroke-linecap="round" opacity="0.72"/>
    <path d="M101 287C132 166 213 117 256 117C299 117 380 166 411 287" fill="none" stroke="#68759E" stroke-width="5" stroke-linecap="round" opacity="0.42"/>

    <!-- thirteen lights around the compact -->
    <g fill="#F3CD72" opacity="0.92">
      <circle cx="256.00" cy="43.00" r="7.2"/>
      <circle cx="354.18" cy="66.02" r="6.7"/>
      <circle cx="426.10" cy="128.78" r="6.3"/>
      <circle cx="461.30" cy="217.56" r="6.7"/>
      <circle cx="450.39" cy="312.47" r="6.3"/>
      <circle cx="396.55" cy="391.96" r="6.7"/>
      <circle cx="310.23" cy="461.89" r="6.3"/>
      <circle cx="201.77" cy="461.89" r="6.3"/>
      <circle cx="115.45" cy="391.96" r="6.7"/>
      <circle cx="61.61" cy="312.47" r="6.3"/>
      <circle cx="50.70" cy="217.56" r="6.7"/>
      <circle cx="85.90" cy="128.78" r="6.3"/>
      <circle cx="157.82" cy="66.02" r="6.7"/>
    </g>

    <!-- two moons -->
    <circle cx="165" cy="234" r="35" fill="url(#moonA)" filter="url(#softGlow)"/>
    <path d="M178 201C164 214 158 236 165 257C151 250 142 236 143 220C144 205 153 194 165 189C170 191 175 195 178 201Z" fill="#EDE8FF" opacity="0.62"/>

    <circle cx="348" cy="238" r="31" fill="url(#moonB)" filter="url(#softGlow)"/>
    <path d="M357 210C344 222 340 241 347 259C333 252 326 239 328 225C330 212 338 203 349 199C352 202 355 206 357 210Z" fill="#ECFBFF" opacity="0.56"/>

    <!-- Solyra -->
    <circle cx="256" cy="207" r="62" fill="url(#sun)" filter="url(#softGlow)"/>
    <circle cx="256" cy="207" r="43" fill="none" stroke="#FFF1A4" stroke-width="6" opacity="0.35"/>

    <!-- Wellspring descent line into the cloud sea -->
    <path d="M256 257C270 285 279 306 278 328C278 349 267 365 256 381C245 365 234 349 234 328C233 306 242 285 256 257Z" fill="#EBC86F" opacity="0.83"/>
    <path d="M256 277C263 297 267 314 266 331C266 344 262 354 256 364C250 354 246 344 246 331C245 314 249 297 256 277Z" fill="#FFF5B7" opacity="0.58"/>

    <!-- Cloud Sea -->
    <path d="M-10 332C45 296 84 318 131 302C186 284 214 324 258 308C309 289 341 312 385 302C436 289 472 302 522 274V522H-10Z" fill="url(#cloud)"/>
    <path d="M-10 371C55 341 112 368 164 349C224 328 276 361 331 339C391 315 452 345 522 312V522H-10Z" fill="#FFFFFF" opacity="0.36"/>
    <path d="M34 393C89 371 133 400 183 383C229 367 277 394 324 376C378 355 429 378 478 352" fill="none" stroke="url(#cloudShadow)" stroke-width="18" stroke-linecap="round" opacity="0.88"/>
    <path d="M72 430C124 414 170 438 222 424C275 410 323 438 374 421C417 407 454 415 494 397" fill="none" stroke="#F8FBFF" stroke-width="14" stroke-linecap="round" opacity="0.55"/>

    <!-- inner dark rim for contrast at browser-tab size -->
    <rect x="8" y="8" width="496" height="496" rx="104" ry="104" fill="none" stroke="#030612" stroke-width="16" opacity="0.55"/>
    <rect x="18" y="18" width="476" height="476" rx="94" ry="94" fill="none" stroke="#F2D27A" stroke-width="5" opacity="0.7"/>
  </g>
</svg>
